name: shahihalbukhari
description: "Al-Bukhari — Sahih Hadith Collection in Urdu & English"
publish_to: "none"
version: 1.1.6+11

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.5.1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path: ^1.9.1
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2
  shimmer: ^3.0.0
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^1.1.1
  url_launcher: ^6.3.2
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  isar_community_generator: 3.3.2
  build_runner: ^2.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#0A7E47"
  image: assets/icon/splash_icon_edge.png
  android_12:
    image: assets/icon/splash_icon_edge.png
    color: "#0A7E47"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/icon/
